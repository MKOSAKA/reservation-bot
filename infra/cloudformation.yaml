AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  reservation-bot 実行基盤。t4g.small を通常は停止し、EventBridge Scheduler で必要時のみ起動する。
  SSH は開けず SSM Session Manager のみ。秘密情報は Secrets Manager（reservation-bot/*）。

Parameters:
  VpcCidr:
    Type: String
    Default: 10.80.0.0/16
    Description: 専用VPC。既存（PPPark 172.30.0.0/16・Mamegra 10.0.0.0/16）と重ならない範囲
  SubnetCidr:
    Type: String
    Default: 10.80.1.0/24
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: ap-northeast-1a
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.micro]
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id
  RepoUrl:
    Type: String
    Default: https://github.com/MKOSAKA/reservation-bot.git
  GitHubRepo:
    Type: String
    Default: MKOSAKA/reservation-bot
    Description: 登録用 GitHub Actions を許可するリポジトリ（owner/name）
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: アカウントに token.actions.githubusercontent.com の OIDC プロバイダが既にあれば false

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  # --- 専用ネットワーク（会社の本番VPCとは経路を持たない。VPC・IGW・サブネットは無料、NATは使わない）
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: reservation-bot }, { Key: Project, Value: reservation-bot }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: reservation-bot }, { Key: Project, Value: reservation-bot }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref SubnetCidr
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: reservation-bot-public }, { Key: Project, Value: reservation-bot }]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: reservation-bot }, { Key: Project, Value: reservation-bot }]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: reservation-bot (no inbound)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Project, Value: reservation-bot }]

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: reservation-bot-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: reservation-bot-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadOwnSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:reservation-bot/*
              - Sid: ManageWakeSchedules
                Effect: Allow
                Action: [scheduler:CreateSchedule, scheduler:GetSchedule, scheduler:DeleteSchedule]
                Resource: !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/reservation-bot/*
              - Sid: PassWakeRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/reservation-bot-wake
                Condition:
                  StringEquals: { iam:PassedToService: scheduler.amazonaws.com }
              - Sid: StopSelfOnly
                Effect: Allow
                Action: ec2:StopInstances
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals: { aws:ResourceTag/Project: reservation-bot }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  WakeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: reservation-bot-wake
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }

  WakePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: start-reservation-bot
      Roles: [!Ref WakeRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ec2:StartInstances
            Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}

  ScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: reservation-bot

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        InstanceInitiatedShutdownBehavior: stop
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs: { VolumeSize: 16, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }

  Instance:
    Type: AWS::EC2::Instance
    DependsOn: [DefaultRoute, SubnetRouteTable]
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref PublicSubnet
          AssociatePublicIpAddress: true
          GroupSet: [!Ref SecurityGroup]
      Tags:
        - { Key: Name, Value: reservation-bot }
        - { Key: Project, Value: reservation-bot }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # 初回起動時のみ: リポジトリを取得して bootstrap.sh を実行する
          set -euo pipefail
          exec > /var/log/reservation-bot-userdata.log 2>&1
          apt-get update -y && apt-get install -y git jq python3
          snap install aws-cli --classic
          export AWS_REGION=${AWS::Region}
          TOKEN=$(/snap/bin/aws secretsmanager get-secret-value --secret-id reservation-bot/deploy-github-token --query SecretString --output text)
          # Basic認証ヘッダ方式は GitHub に拒否されたため、URL埋め込みで取得し、直後に remote を素のURLへ戻す
          GIT_TERMINAL_PROMPT=0 git clone "https://x-access-token:$TOKEN@github.com/MKOSAKA/reservation-bot.git" /opt/reservation-bot
          git -C /opt/reservation-bot remote set-url origin ${RepoUrl}
          unset TOKEN
          bash /opt/reservation-bot/infra/scripts/bootstrap.sh

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # main への push（予約リクエストのマージ）時だけ引き受けられる。できるのは起動と登録スクリプトの実行のみ
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: reservation-bot-github-actions
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/main
      Policies:
        - PolicyName: register-requests
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: StartAndWait
                Effect: Allow
                Action: ec2:StartInstances
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}
              - Sid: Describe
                Effect: Allow
                Action: [ec2:DescribeInstances, ssm:DescribeInstanceInformation, ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: "*"
              - Sid: RunOnlyOnThisInstance
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript

Outputs:
  VpcId:
    Value: !Ref Vpc
  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsRole.Arn
  InstanceId:
    Value: !Ref Instance
  WakeRoleArn:
    Value: !GetAtt WakeRole.Arn
